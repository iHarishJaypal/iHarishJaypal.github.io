name: TelcoNet Prototype Audit

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "telconet-ui.css"
      - "telconet-ui.js"
      - "scripts/**"
      - ".github/workflows/telconet-prototype-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "telconet-ui.css"
      - "telconet-ui.js"
      - "scripts/**"
      - ".github/workflows/telconet-prototype-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    name: Static prototype checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run TelcoNet prototype audit
        run: node scripts/prototype-audit.mjs

  browser-audit:
    name: Responsive and interaction checks
    runs-on: ubuntu-24.04
    needs: source-audit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1-ubuntu-24.04
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - name: Install Chromium browser
        run: npx playwright install chromium
      - name: Run responsive and interaction browser audit
        run: node --test scripts/browser-audit.mjs
