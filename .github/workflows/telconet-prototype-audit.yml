name: TelcoNet Prototype Audit

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "telconet-ui.css"
      - "telconet-ui.js"
      - "scripts/**"
      - ".github/workflows/telconet-prototype-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "telconet-ui.css"
      - "telconet-ui.js"
      - "scripts/**"
      - ".github/workflows/telconet-prototype-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    name: Static prototype checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run TelcoNet prototype audit
        run: node scripts/prototype-audit.mjs

  browser-audit:
    name: Responsive and interaction checks
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    needs: source-audit
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify the preinstalled browser runtime
        run: |
          node --version
          npm --version
          test -d "$PLAYWRIGHT_BROWSERS_PATH"
      - name: Install the matching Playwright package
        run: npm install --no-save playwright@1.65.1
      - name: Run responsive and interaction browser audit
        run: node --test scripts/browser-audit.mjs
      - name: Upload browser audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telconet-browser-audit-${{ github.run_id }}
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
